name: Bug report / 问题反馈
description: Report a reproducible StopWatch problem without private data.
body:
  - type: textarea
    id: environment
    attributes:
      label: Hardware, firmware revision and app version / 设备与版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected and actual result / 复现步骤与结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 脱敏证据
      description: Never include tokens, PINs, SSIDs, personal conversations or raw dumps.
