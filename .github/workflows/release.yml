name: Source release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  release:
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check version and create source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          mkdir dist
          git archive --format=tar.gz --prefix=muse-stopwatch/ HEAD > "dist/muse-stopwatch-$TAG.tar.gz"
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish source only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
