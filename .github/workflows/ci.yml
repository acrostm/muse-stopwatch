name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python tools/fetch_test_deps.py "$RUNNER_TEMP/cjson"
      - run: CJSON_SOURCE_DIR="$RUNNER_TEMP/cjson" python tools/validate.py
  firmware:
    name: Firmware
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned SDK and verify bundle
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python build.py build --out /tmp/muse-stopwatch-sdk
          CC=cc CXX=c++ python tools/test_ui.py /tmp/muse-stopwatch-sdk/esp32/managed_components/lvgl__lvgl
          python package.py create /tmp/muse-stopwatch-sdk/esp32/build-stopwatch --archive-root /tmp/verified
          python package.py verify /tmp/verified/*
